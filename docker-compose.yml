services:
  ev-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/ev_data.db

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    user: "1000"
    volumes:
      - ${CLOUDFLARED_DIR}:/etc/cloudflared:ro
    restart: unless-stopped
    profiles:
      - disabled
