// ─── helper components ───────────────────────────────────────────────────────

function AutoTextarea({ value, onChange, placeholder }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.style.height = "auto";
    ref.current.style.height = ref.current.scrollHeight + "px";
  }, [value]);
  return (
    <textarea
      ref={ref}
      value={value}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
      rows={1}
      className="input-dark"
      style={{ width: "100%", lineHeight: "1.5", fontSize: "11px", padding: "7px 10px", background: "#0d0d1a", border: "1px solid #2a2a4a" }}
    />
  );
}

function Panel({ title, open, onToggle, color, children }) {
  return (
    <div style={{ marginBottom: "10px" }}>
      <button
        onClick={onToggle}
        className="panel-toggle"
        style={{
          background: open ? "#0d1a2e" : "#16213e",
          borderColor: open ? color + "88" : "#2a2a4a",
          borderRadius: open ? "8px 8px 0 0" : "8px",
          color: open ? color : "#555",
        }}
      >
        {title}{open ? "　▲" : "　▼"}
      </button>
      {open && (
        <div className="panel-body" style={{ borderColor: color + "44" }}>
          {children}
        </div>
      )}
    </div>
  );
}

function StatRow({ stat, val, color, macho, onChange }) {
  const isMaxed = val >= MAX_STAT;
  const vLeft   = vitaminLeft(val);
  const steps = macho ? [[-1,"－"],[1,"＋2"],[2,"＋4"],[3,"＋6"]] : [[-1,"－"],[1,"＋1"],[2,"＋2"],[3,"＋3"]];
  return (
    <div className="card" style={{ padding: "9px 12px", borderColor: isMaxed ? "#7fff7f44" : "#2a2a4a" }}>
      <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "5px" }}>

function IVChecker({ color }) {
  const [open,        setOpen]       = useState(false);
  const [mon,         setMon]        = useState(0);
  const [lvStr,       setLvStr]      = useState("50");
  const [nat,         setNat]        = useState(0);
  const [actual,      setActual]     = useState({hp:"",atk:"",def:"",spa:"",spd:"",spe:""});
  const [ev,          setEV]         = useState({hp:0,atk:0,def:0,spa:0,spd:0,spe:0});
  const [searchQuery, setSearchQuery] = useState("");
  const [showSearch,  setShowSearch]  = useState(false);

  const lv     = Math.max(1, Math.min(100, parseInt(lvStr) || 1));
  const nature = NATURES[nat];
  const pmon   = POKEMON_DATA[mon];

  const calcIV = (statKey) => {
    const a = parseInt(actual[statKey]);
    if (isNaN(a) || a <= 0) return null;
    const base  = pmon[PD[statKey]];
    const evVal = Math.max(0, Math.min(255, parseInt(ev[statKey]) || 0));
    const res   = [];
    for (let iv = 0; iv <= 31; iv++) {
      const inner = Math.floor((2 * base + iv + Math.floor(evVal / 4)) * lv / 100);
      const s5    = inner + 5;
      const stat  = statKey === "hp" ? inner + lv + 10
        : nature.up === statKey ? Math.floor(s5 * 11 / 10)
        : nature.dn === statKey ? Math.floor(s5 *  9 / 10)
        : s5;
      if (stat === a) res.push(iv);
    }
    return res;
  };

  const ivDisp = (k) => {
    const r = calcIV(k);
    if (r === null)    return "—";
    if (r.length === 0) return "？";
    if (r.length === 1) return `${r[0]}`;
    return `${r[0]}〜${r[r.length - 1]}`;
  };

  const ivColor = (k) => {
    const r = calcIV(k);
    if (!r || r.length === 0)    return "#555";
    if (r[0] >= 28)              return "#7fff7f";
    if (r[r.length - 1] <= 10)  return "#ff6b6b";
    return "#f5d020";
  };

  const natLabel = (n) => n.up
    ? `${n.name}（↑${STAT_JP[n.up]} / ↓${STAT_JP[n.dn]}）`
    : `${n.name}（補正なし）`;

  return (
    <Panel title="🔬 個体値チェッカー（Gen III）" open={open} onToggle={() => setOpen(v => !v)} color={color}>
      <div style={{ position: "relative", marginBottom: "8px" }}>
        <input
          value={showSearch ? searchQuery : `${String(POKEMON_DATA[mon][0]).padStart(3,"0")} ${POKEMON_DATA[mon][1]}`}
          onChange={e => { setSearchQuery(e.target.value); setShowSearch(true); }}
          onFocus={() => { setSearchQuery(""); setShowSearch(true); }}
          onBlur={() => setTimeout(() => setShowSearch(false), 150)}
          placeholder="ポケモン名・番号で検索…"
          className="input-dark"
          style={{ width: "100%" }}
        />
        {showSearch && (() => {
          const results = searchQuery
            ? POKEMON_DATA.filter(p => p[1].includes(searchQuery) || String(p[0]).padStart(3,"0").includes(searchQuery))
            : POKEMON_DATA;
          return (
            <div style={{ position: "absolute", top: "100%", left: 0, right: 0, background: "#16213e", border: "1px solid #3a3a5a", borderTop: "none", borderRadius: "0 0 6px 6px", maxHeight: "200px", overflowY: "auto", zIndex: 50 }}>
              {results.length === 0
                ? <div style={{ padding: "8px", fontSize: "11px", color: "#444" }}>該当なし</div>
                : results.map(p => (
                    <div
                      key={p[0]}
                      className="search-item"
                      onMouseDown={() => { setMon(p[0] - 1); setSearchQuery(""); setShowSearch(false); }}
                      style={{ padding: "5px 8px", cursor: "pointer", fontSize: "12px", color: mon === p[0] - 1 ? color : "#ccc", background: mon === p[0] - 1 ? color + "22" : "transparent" }}
                    >
                      {String(p[0]).padStart(3,"0")} {p[1]}
                    </div>
                  ))
              }
            </div>
          );
        })()}
      </div>

      <div style={{ display: "flex", gap: "6px", marginBottom: "10px" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: "3px" }}>
          <div style={{ fontSize: "9px", color: "#555" }}>レベル</div>
          <input
            type="number" min="1" max="100" value={lvStr}
            onChange={e => setLvStr(e.target.value)}
            onBlur={() => setLvStr(String(lv))}
            className="input-dark"
            style={{ width: "54px", fontSize: "13px", padding: "5px 6px", textAlign: "center" }}
          />
        </div>
        <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: "3px" }}>
          <div style={{ fontSize: "9px", color: "#555" }}>性格</div>
          <select value={nat} onChange={e => setNat(Number(e.target.value))} className="input-dark" style={{ width: "100%", fontSize: "11px", padding: "5px 6px" }}>
            {NATURES.map((n, i) => <option key={i} value={i}>{natLabel(n)}</option>)}
          </select>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "62px 52px 1fr 44px", gap: "3px 6px", alignItems: "center", marginBottom: "4px" }}>
        {["ステータス","努力値","実数値","個体値"].map((h, i) => (
          <div key={h} style={{ fontSize: "9px", color: "#444", textAlign: i > 0 ? "center" : undefined }}>{h}</div>
        ))}
      </div>
      {STATS.map(stat => {
        const isUp = nature.up === stat.key;
        const isDn = nature.dn === stat.key;
        return (
          <div key={stat.key} style={{ display: "grid", gridTemplateColumns: "62px 52px 1fr 44px", gap: "3px 6px", alignItems: "center", marginBottom: "4px" }}>
            <div style={{ fontSize: "11px", color: isUp ? "#f5d020" : isDn ? "#ff6b6b" : "#888" }}>
              {stat.jp}{isUp ? "↑" : isDn ? "↓" : ""}
            </div>
            <input
              type="number" min="0" max="255" value={ev[stat.key]}
              onChange={e => setEV(prev => ({ ...prev, [stat.key]: Math.max(0, Math.min(255, parseInt(e.target.value) || 0)) }))}
              className="input-dark"
              style={{ fontSize: "11px", padding: "4px 5px", textAlign: "center", width: "100%", color: "#aaa" }}
            />
            <input
              type="number" min="1" value={actual[stat.key]}
              onChange={e => setActual(prev => ({ ...prev, [stat.key]: e.target.value }))}
              placeholder="実数値"
              className="input-dark"
              style={{ fontSize: "11px", padding: "4px 5px", textAlign: "center", width: "100%" }}
            />
            <div style={{ fontSize: "13px", fontWeight: "bold", color: ivColor(stat.key), textAlign: "center" }}>{ivDisp(stat.key)}</div>
          </div>
        );
      })}
      <div style={{ fontSize: "8px", color: "#333", marginTop: "6px" }}>「？」は実数値・努力値・レベルを確認してください</div>
    </Panel>
  );
}

function EVTracker() {
  const [party,     setParty]    = useState(DEFAULT_PARTY);
  const [allEVs,    setAllEVs]   = useState(() => Object.fromEntries(DEFAULT_PARTY.map(p => [p.name, initEVs()])));
  const [selected,  setSelected] = useState(DEFAULT_PARTY[0].name);
  const [loaded,    setLoaded]   = useState(false);
  const [macho,     setMacho]    = useState(false);
  const [activeTab, setActiveTab] = useState("ikusei");
  const [adding,    setAdding]   = useState(false);
  const [newName,   setNewName]  = useState("");
  const [newIcon,   setNewIcon]  = useState("🐣");
  const [newColor,  setNewColor] = useState(COLORS[0]);

  useEffect(() => {
    fetch("/api/data")
      .then(r => r.json())
      .then(saved => {
        if (saved.party)    setParty(saved.party);
        if (saved.allEVs)   setAllEVs(saved.allEVs);
        if (saved.selected) setSelected(saved.selected);
      })
      .catch(() => {})
      .finally(() => setLoaded(true));
  }, []);

  useEffect(() => {
    if (!loaded) return;
    fetch("/api/data", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ party, allEVs, selected }),
    }).catch(() => {});
  }, [party, allEVs, selected, loaded]);

  const mon       = party.find(p => p.name === selected) || party[0];
  const evs       = allEVs[selected] || initEVs();
  const total     = Object.values(evs).reduce((a, b) => a + b, 0);
  const remaining = MAX_TOTAL - total;

  const change = (key, delta) => {
    const d = delta > 0 ? delta * (macho ? 2 : 1) : delta;
    setAllEVs(prev => {
      const cur      = (prev[selected] || initEVs())[key];
      const curTotal = Object.values(prev[selected] || initEVs()).reduce((a, b) => a + b, 0);
      let next = Math.max(0, Math.min(MAX_STAT, cur + d));
      if (curTotal - cur + next > MAX_TOTAL) next = cur + (MAX_TOTAL - curTotal);
      return { ...prev, [selected]: { ...(prev[selected] || initEVs()), [key]: Math.max(0, next) } };
    });
  };

  const reset = () => setAllEVs(prev => ({ ...prev, [selected]: initEVs() }));

  const updateMemo = (text) => setParty(prev => prev.map(p => p.name === selected ? { ...p, memo: text } : p));

  const removeMon = (name) => {
    const next = party.filter(p => p.name !== name);
    setParty(next);
    setAllEVs(prev => { const n = { ...prev }; delete n[name]; return n; });
    if (selected === name && next.length > 0) setSelected(next[0].name);
  };

  const addMon = () => {
    const trimmed = newName.trim();
    if (!trimmed || party.find(p => p.name === trimmed)) return;
    setParty(prev => [...prev, { name: trimmed, icon: newIcon, color: newColor, memo: "" }]);
    setAllEVs(prev => ({ ...prev, [trimmed]: initEVs() }));
    setSelected(trimmed);
    setAdding(false);
    setNewName("");
  };

  if (!loaded) return (
    <div style={{ minHeight: "100vh", background: "#1a1a2e", display: "flex", alignItems: "center", justifyContent: "center", color: "#888", fontFamily: "monospace" }}>
      ロード中…
    </div>
  );

  return (
    <div className="app-wrap">
      {/* Header */}
      <div style={{ textAlign: "center", marginBottom: "18px" }}>
        <div style={{ fontSize: "10px", letterSpacing: "4px", color: "#555", marginBottom: "2px" }}>FireRed · AUTO SAVE</div>
        <div style={{ fontSize: "20px", letterSpacing: "2px", color: mon.color, textShadow: `0 0 20px ${mon.color}66` }}>
          努力値トラッカー
        </div>
      </div>

      <div className="app-layout">
        {/* ===== 育成カラム ===== */}
        <div className={activeTab === "ikusei" ? "" : "col-hidden"}>

          {/* Party grid */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "7px", marginBottom: "16px" }}>
            {party.map(p => {
              const t        = Object.values(allEVs[p.name] || initEVs()).reduce((a, b) => a + b, 0);
              const isActive = selected === p.name;
              return (
                <button
                  key={p.name}
                  className={`mon-btn${isActive ? " active" : ""}`}
                  onClick={() => setSelected(p.name)}
                  style={{
                    width: "100%", cursor: "pointer", color: "#e8e8e8", textAlign: "center",
                    background: isActive ? `${p.color}22` : "#16213e",
                    border: `2px solid ${isActive ? p.color : "#2a2a4a"}`,
                    borderRadius: "10px", padding: "10px 6px 8px",
                  }}
                >
                  <div style={{ fontSize: "20px", marginBottom: "3px" }}>{p.icon}</div>
                  <div style={{ fontSize: "10px", color: isActive ? p.color : "#aaa", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.name}</div>
                  <div style={{ fontSize: "9px", color: t >= MAX_TOTAL ? "#7fff7f" : "#555", marginTop: "2px" }}>{t}/{MAX_TOTAL}</div>
                </button>
              );
            })}
            <button
              onClick={() => setAdding(true)}
              style={{ background: "#16213e", border: "2px dashed #2a2a4a", borderRadius: "10px", padding: "10px 6px", cursor: "pointer", color: "#555", fontSize: "20px", textAlign: "center", lineHeight: 1 }}
            >
              <div>＋</div>
              <div style={{ fontSize: "9px", marginTop: "4px" }}>追加</div>
            </button>
          </div>

          {adding && (
            <AddMonModal
              newName={newName} newIcon={newIcon} newColor={newColor}
              setNewName={setNewName} setNewIcon={setNewIcon} setNewColor={setNewColor}
              onAdd={addMon}
              onCancel={() => { setAdding(false); setNewName(""); }}
              borderColor={mon.color}
            />
          )}

          {/* Total bar */}
          <div className="card" style={{ padding: "10px 14px", marginBottom: "10px", borderColor: mon.color + "33" }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: "11px", marginBottom: "5px" }}>
              <span style={{ color: mon.color }}>合計努力値</span>
              <span>{total}/{MAX_TOTAL}　残り<span style={{ color: remaining < 50 ? "#ff6b6b" : "#aaa" }}>{remaining}</span></span>
            </div>
            <div className="bar-bg" style={{ height: "7px" }}>
              <div className="bar-fill" style={{ height: "100%", width: `${(total / MAX_TOTAL) * 100}%`, background: total >= MAX_TOTAL ? "#7fff7f" : `linear-gradient(90deg, ${mon.color}88, ${mon.color})`, borderRadius: "4px" }} />
            </div>
          </div>

          {/* 強制ギプス */}
          <button
            onClick={() => setMacho(v => !v)}
            style={{
              width: "100%", cursor: "pointer", fontFamily: "inherit",
              background: macho ? "#3a1a1a" : "#16213e",
              border: `1px solid ${macho ? "#ff6b35aa" : "#2a2a4a"}`,
              borderRadius: "7px", color: macho ? "#ff6b35" : "#555",
              fontSize: "11px", padding: "7px", marginBottom: "10px", letterSpacing: "1px",
            }}
          >
            {macho ? "🥊 強制ギプス装備中（EV×2）" : "🥊 強制ギプス　OFF"}
          </button>

          {/* Stats */}
          <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "14px" }}>
            {STATS.map(stat => (
              <StatRow key={stat.key} stat={stat} val={evs[stat.key] || 0} color={mon.color} macho={macho} onChange={d => change(stat.key, d)} />
            ))}
          </div>

          {/* メモ */}
          <div className="card" style={{ padding: "10px 12px", marginBottom: "10px", borderColor: mon.color + "22" }}>
            <div style={{ fontSize: "10px", color: "#555", marginBottom: "6px", letterSpacing: "1px" }}>メモ（性格・持ち物・技など）</div>
            <AutoTextarea value={mon.memo || ""} onChange={updateMemo} placeholder="例：ようき　こだわりスカーフ　地震 / 岩雪崩 / …" />
          </div>

          <div style={{ display: "flex", gap: "8px", marginBottom: "10px" }}>
            <button onClick={reset} style={{ flex: 1, background: "transparent", border: "1px solid #2a2a4a", borderRadius: "7px", color: "#555", fontSize: "11px", padding: "9px", cursor: "pointer", fontFamily: "inherit", letterSpacing: "2px" }}>
              EV リセット
            </button>
            {party.length > 1 && (
              <button onClick={() => removeMon(selected)} style={{ flex: 1, background: "transparent", border: "1px solid #ff444444", borderRadius: "7px", color: "#ff6666", fontSize: "11px", padding: "9px", cursor: "pointer", fontFamily: "inherit", letterSpacing: "2px" }}>
                {selected} を削除
              </button>
            )}
          </div>

          <div style={{ textAlign: "center", fontSize: "8px", color: "#2a2a4a", letterSpacing: "1px" }}>
            GEN III · MAX 252/STAT · MAX 510/TOTAL · AUTO SAVE
          </div>
        </div>

        {/* ===== 調査カラム ===== */}
        <div className={activeTab === "chosa" ? "" : "col-hidden"}>
          <IVChecker color={mon.color} />
          <EVSearch macho={macho} color={mon.color} />
          <LocationGuide color={mon.color} />
          <EVGuide color={mon.color} />
        </div>
      </div>

      {/* Bottom nav（モバイルのみ） */}
      <nav className="bottom-nav">
        <button onClick={() => setActiveTab("ikusei")} style={{ color: activeTab === "ikusei" ? mon.color : "#555", borderTopColor: activeTab === "ikusei" ? mon.color : "transparent" }}>
          💪 育成
        </button>
        <button onClick={() => setActiveTab("chosa")} style={{ color: activeTab === "chosa" ? mon.color : "#555", borderTopColor: activeTab === "chosa" ? mon.color : "transparent" }}>
          🔬 調査
        </button>
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EVTracker />);
    </script>
  </body>
</html>
