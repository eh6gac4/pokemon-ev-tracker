<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ポケログ</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
    <link rel="apple-touch-icon" href="/icon-pixel.png">

  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/preact@10/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/preact@10/hooks/dist/hooks.umd.js"></script>
    <script src="https://unpkg.com/preact@10/compat/dist/compat.umd.js"></script>
    <script>
      // Reactのグローバルエイリアスを設定
      window.React = preactCompat;
      // createRootのポリフィル（preact/compatに含まれないため）
      window.ReactDOM = {
        createRoot: function(container) {
          return { render: function(el) { preact.render(el, container); } };
        }
      };
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="/js/data-pokemon.js"></script>
    <script src="/js/data-moves.js"></script>
    <script src="/js/data-items.js"></script>
    <script type="text/babel" src="/js/components-base.js"></script>
    <script type="text/babel" src="/js/components-ikusei.js"></script>
    <script type="text/babel" src="/js/components-chosa.js"></script>
    <script type="text/babel" src="/js/components-boken.js"></script>
    <script type="text/babel" src="/js/tracker.js"></script>
  </body>
