<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>オフライン - ポケログ</title>
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👾</text></svg>">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        background: #1a1a2e;
        color: #e8e8e8;
        font-family: 'Courier New', monospace;
        text-align: center;
      }
      .icon { font-size: 64px; line-height: 1; }
      h1 { font-size: 20px; margin: 0; letter-spacing: 2px; color: #7ec8e3; }
      p { margin: 0; font-size: 14px; line-height: 1.7; color: #b0b0c0; }
      button {
        margin-top: 8px;
        padding: 12px 24px;
        background: #16213e;
        border: 1px solid #3a3a5a;
        border-radius: 8px;
        color: #e8e8e8;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 1px;
        cursor: pointer;
      }
      button:active { background: #2a2a4a; }
    </style>
  </head>
  <body>
    <div class="icon">👾</div>
    <h1>オフラインです</h1>
    <p>
      ネットワークに接続できません。<br>
      接続を確認してから再度お試しください。
    </p>
    <button onclick="location.reload()">もう一度ためす</button>
  </body>
</html>
